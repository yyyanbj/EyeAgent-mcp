package: classification
entry: tool_impl:ClassificationTool
category: vision
description: "General ophthalmic image classification: modality, quality, laterality, multi-disease screening, and age estimation."
shared:
  environment_ref: py312
  runtime:
    load_mode: auto
    idle_timeout_s: 600
    device_policy: auto
    preload: false
  io:
    input_schema:
      image_path: path
    output_schema:
      prediction: string|number  # top-1 label or numeric (e.g., age)
      label: string              # alias of prediction for label-type tasks
      predictions: array         # optional top-N labels
      probabilities: object      # map of label -> probability
      inference_time: number     # seconds
      unit: string               # optional (e.g., 'years' for cfp_age)
  model_defaults:
    precision: auto
    lazy: true
variants:
  - variant: modality
    version: 0.1.0
    description: "Classify imaging modality (CFP, OCT, FFA, etc.)"
    params:
      task: modality
      threshold: 0.3
  - variant: cfp_quality
    version: 0.1.0
    description: "Assess fundus photo quality (clarity/occlusion/exposure)"
    params:
      task: cfp_quality
      threshold: 0.3
  - variant: laterality
    version: 0.1.0
    description: "Determine laterality (left/right eye)"
    params:
      task: laterality
      threshold: 0.3
  - variant: multidis
    version: 0.1.0
    description: "Screen for multiple retinal diseases"
    params:
      task: multidis
      threshold: 0.3
  - variant: cfp_age
    version: 0.1.0
    description: "Estimate subject age from fundus photo (years)"
    params:
      task: cfp_age
      threshold: 0.0
metadata:
  authors: ["EyeAgent Team"]
  license: Apache-2.0
notes:
  - 0.1.0 classification package