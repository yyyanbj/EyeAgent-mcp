package: disease_specific_cls
entry: tool_impl:DiseaseSpecificClassificationTool
category: vision
description: "Disease-specific classification based on RETFound ViT-B/16 checkpoints; each variant targets a specific condition."
shared:
  environment_ref: py311-retfound
  runtime:
    load_mode: auto  # changed from 'lazy' (invalid) to valid load mode
    idle_timeout_s: 900
    device_policy: auto
    preload: false
  io:
    input_schema:
      image_path: path
    output_schema:
      disease: string
      probability: number
      predicted: boolean
      all_probabilities: object
      probabilities: object
      prediction: string
      label: string
      inference_time: number
  model_defaults:
    precision: auto
    lazy: true
    threshold: 0.5
variants:
  # Auto-generated list of disease-specific weight folders (finetune & lp)
  # Tool names/IDs drop the training suffix (e.g., AMD) while params.variant
  # preserves the on-disk folder (e.g., AMD_finetune).
  - variant: AH
    version: 0.1.0
    description: "Disease-specific classifier for AH"
    params: { variant: AH_finetune }
  - variant: AION
    version: 0.1.0
    description: "Disease-specific classifier for AION (anterior ischemic optic neuropathy)"
    params: { variant: AION_finetune }
  - variant: AMD
    version: 0.1.0
    description: "Disease-specific classifier for AMD (age-related macular degeneration)"
    params: { variant: AMD_finetune }
  - variant: CM
    version: 0.1.0
    description: "Disease-specific classifier for CM (cytomegalovirus retinitis)"
    params: { variant: CM_finetune }
  - variant: CNV
    version: 0.1.0
    description: "Disease-specific classifier for CNV (choroidal neovascularization)"
    params: { variant: CNV_finetune }
  - variant: CSCR
    version: 0.1.0
    description: "Disease-specific classifier for CSCR (central serous chorioretinopathy)"
    params: { variant: CSCR_finetune }
  - variant: Coats
    version: 0.1.0
    description: "Disease-specific classifier for Coats disease"
