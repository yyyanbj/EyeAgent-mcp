package: rag
entry: tool_impl:RAGQueryTool
# Do NOT set category here; discovery will infer from folder (tools/rag) to keep id as 'rag:query'
description: "Lightweight local RAG query over markdown/txt documents for ophthalmology."
shared:
  # Use an isolated environment for RAG to avoid polluting core deps
  environment_ref: py312-rag
  runtime:
    # Run in subprocess so the tool executes under the uv-managed env
    load_mode: subprocess
    # Keep worker alive effectively indefinitely (server-wide lifecycle already prevents unload)
    idle_timeout_s: 99999999
    device_policy: auto
    # Hint to server that this tool can be preloaded; with eager mode it will be spawned on boot
    preload: true
  io:
    input_schema:
      query: string
      top_k: integer
    output_schema:
      items: array
      source: string
      inference_time: number
  model_defaults:
    precision: auto
    lazy: false
variants:
  - variant: query
    version: 0.1.0
    description: "Retrieve and answer questions from local ophthalmology documents"
    params:
      top_k: 5
      # Max PDF pages to extract during indexing/warmup (to cap warmup time)
      maxpages: 600
      # Retrieval mode:
      #   - "qdrant": hybrid vector search (recommended for large corpora)
      #   - "faiss": local FAISS vector store (good for smaller, self-contained corpora like PDFs)
      #   - "local": simple keyword matching (no vector deps)
      mode: faiss
      # Vector store settings (paths are resolved relative to tool root if not absolute)
      collection_name: rag_collection
      vector_local_path: ../../temp/rag/qdrant
      doc_local_path: ../../temp/rag/docstore
      # FAISS settings (used when mode=faiss)
      faiss_index_dir: ../../temp/rag/faiss_index
      embedding_model: BAAI/bge-m3 # BAAI/bge-small-zh-v1.5
      # PDF book title metadata source: "auto" uses PDF metadata with filename fallback; "filename" uses filename only
      bookmeta: auto
      # Chunking for ingestion
      chunk_size: 800
      chunk_overlap: 120
      # default corpus directories (relative paths allowed). Override via env or server tool config.
      corpus_dirs:
        - ../../weights/rag/books
metadata:
  authors: ["EyeAgent Team"]
  license: Apache-2.0
  description: Lightweight local RAG query over markdown/txt/PDF files with optional Qdrant or FAISS vector search.
notes:
  - 0.1.0 initial rag:query tool
  - 0.2.0 add FAISS mode and PDF per-page ingestion with (book, page) metadata
